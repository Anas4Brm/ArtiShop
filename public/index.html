<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtiShop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ArtiShop</h1>
    <p>L'artisanat marocain en ligne</p>
  </header>

  <main>
    <section>
      <div class="toolbar">
        <h2>Catalogue</h2>
        <select id="category">
          <option value="">Toutes les catégories</option>
        </select>
      </div>
      <div id="products" class="grid"></div>
    </section>

    <aside>
      <h2>Panier</h2>
      <ul id="cart-items"></ul>
      <p class="total">Total : <span id="cart-total">0</span> MAD</p>
      <p id="message" class="message"></p>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
